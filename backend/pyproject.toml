[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "product-to-mcp"
version = "0.1.0"
description = "Prototype platform for compiling customer APIs into MCP servers."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/product_to_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

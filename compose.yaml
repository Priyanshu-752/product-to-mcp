services:
  backend:
    build:
      context: ./backend
    working_dir: /app
    environment:
      PRODUCT_TO_MCP_PUBLIC_BASE_URL: http://127.0.0.1:8000
    ports:
      - "8000:8000"
    volumes:
      - ./.runtime:/app/.runtime
    command: uvicorn product_to_mcp.main:app --host 0.0.0.0 --port 8000
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

